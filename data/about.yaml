intro:
  - "我是霍楠（HN），计算机科学与技术专业在读，也是一名持续折腾开发环境、系统优化与小工具的独立开发者。"
  - "初中到高中的 6 年里我一直担任班级「网管」，协助任课教师完成授课任务，积累了大量的电脑维护与办公软件使用经验。"
  - "现在专注用 AI 辅助开发把想法快速变成可运行的工具，并把踩坑过程整理成新手也能跟着做下来的教程。"


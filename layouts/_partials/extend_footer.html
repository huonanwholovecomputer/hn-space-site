{{- /* 三态主题切换：浅色 → 深色 → 跟随系统 → 循环。
      覆盖 PaperMod 默认的「手动选择后永久固定」行为，
      让用户随时可以切回「跟随系统」，解决手动选过后系统主题变化被忽略的问题。
      本脚本在主题 footer 脚本之后渲染执行（主题脚本是内联同步的，
      我们在其后注入；并用 DOMContentLoaded 兜底确保按钮已存在）。 */}}
<script>
  (function () {
    function setup() {
      var btn = document.getElementById('theme-toggle');
      if (!btn || btn.__triStateBound) return;
      btn.__triStateBound = true;

      /* 克隆替换按钮，清除 PaperMod 已绑定的 2 态 click 监听器 */
      var fresh = btn.cloneNode(true);
      btn.parentNode.replaceChild(fresh, btn);

      var label = { light: '浅色', dark: '深色', auto: '跟随系统' };
      var tipLabel = { light: '浅色模式', dark: '深色模式', auto: '跟随系统' };

      function currentLabel() {
        var html = document.documentElement;
        var hasPref = !!localStorage.getItem('pref-theme');
        if (!hasPref) return '跟随系统';
        return html.dataset.theme === 'dark' ? '深色' : '浅色';
      }

      /* 当前模式提示气泡：设置文字并弹出，短暂停留后收回 */
      var tipTimer = null;
      function showModeTip(mode) {
        var tip = fresh.parentNode.querySelector('.theme-mode-tip');
        if (!tip) return;
        if (tipTimer) {
          window.clearTimeout(tipTimer);
        }
        tip.textContent = tipLabel[mode] || '跟随系统';
        /* 强制重排以重触发过渡 */
        tip.classList.remove('is-visible');
        void tip.offsetWidth;
        tip.classList.add('is-visible');
        tipTimer = window.setTimeout(function () {
          tip.classList.remove('is-visible');
        }, 1600);
      }

      /* 降级方案：浏览器不支持 View Transitions 时，给 <html> 临时挂过渡类，
         让背景/文字/边框等全局元素逐元素渐变；过渡结束后移除。 */
      var themeTransTimer = null;
      function enableThemeTransition() {
        var html = document.documentElement;
        /* 冻结 color-scheme：Chrome 在 color-scheme 由浅切深时，会不断重启后代
           元素的 color 过渡，导致"文字比背景晚结束/节奏不一致"。切换期间先把
           旧的 color-scheme 写死在内联样式上，过渡结束后再放开，让文字与背景同步。 */
        html.style.colorScheme = getComputedStyle(html).colorScheme;
        html.classList.add('theme-transition');
        if (themeTransTimer) window.clearTimeout(themeTransTimer);
        themeTransTimer = window.setTimeout(function () {
          html.classList.remove('theme-transition');
          html.style.removeProperty('color-scheme');
        }, 700);
      }

      /* 应用三态目标（只改状态，不含动画）：localStorage + data-theme + 气泡提示 */
      function applyTheme(next) {
        var html = document.documentElement;
        if (next === 'auto') {
          localStorage.removeItem('pref-theme');
          html.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          localStorage.setItem('pref-theme', next);
          html.dataset.theme = next;
        }
        fresh.title = '主题：' + label[next] + '（点击切换）';
        showModeTip(next);
      }

      fresh.addEventListener('click', function () {
        var html = document.documentElement;
        var current = html.dataset.theme === 'dark' ? 'dark' : 'light';
        var hasPref = !!localStorage.getItem('pref-theme');
        /* 三态推进：浅(手动) → 深(手动) → 跟随系统 → 浅… */
        var next;
        if (!hasPref) {
          next = 'light';
        } else if (current === 'light') {
          next = 'dark';
        } else {
          next = 'auto';
        }

        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (document.startViewTransition && !reduce) {
          /* 首选：View Transitions —— 浏览器对切换前后各截一张全页快照，
             用合成层做交叉淡入。动画跑在合成线程、主线程不参与，
             元素再多也不掉帧；且不再逐元素过渡，color-scheme 拖尾一并消失。 */
          var vt = document.startViewTransition(function () {
            /* 切换瞬间禁用所有逐元素过渡：新快照直接取最终态（否则会截到过渡起点），
               同时避免主线程再跑 N 个元素的重绘。 */
            html.classList.add('theme-vt');
            applyTheme(next);
          });
          var vtCleanup = function () { html.classList.remove('theme-vt'); };
          if (vt && vt.finished) {
            vt.finished.then(vtCleanup, vtCleanup);
          } else {
            window.setTimeout(vtCleanup, 500);
          }
        } else {
          /* 降级：逐元素 CSS 过渡（兼容性最好，元素多时主线程压力较大） */
          enableThemeTransition();
          applyTheme(next);
        }
      });

      fresh.title = '主题：' + currentLabel() + '（点击切换）';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setup);
    } else {
      setup();
    }
  })();
</script>

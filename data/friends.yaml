# ============================================================
# 友链数据（/friends/ 页面的唯一数据源）
# ------------------------------------------------------------
# 加一位朋友：在 friends: 下面按同样格式追加一条即可，页面自动渲染，
# 不需要改模板。
#   name   站点名称（必填）
#   url    站点地址（必填）
#   desc   一句话简介（必填）
#   avatar 头像地址。推荐直接把头像存到 static/img/friends/ 用站内路径
#          （不依赖第三方图床可用性，本地预览也能看到），也支持完整 https 外链
#   tags   标签数组（可选）。页面上会出现标签筛选条——但只有出现 2 个
#          以上不同标签时才会显示，只有一两位朋友时不显示（避免空筛）。
#
# 本站自己的信息（站名 / 简介 / 地址 / 头像）刻意不在这里维护：
# 页面上「添加本站友链」那四行直接取自 hugo.toml 的 title、params.description、
# baseURL 与站内头像文件，改一处即可，不会两边漂移。
# ============================================================

friends:
  - name: 殘月的小窝
    url: https://x0.fan/
    desc: Reborn from the ashes.
    # 头像来自站点 https://x0.fan 的 avatar.webp（286×286，2026-10-04 取的快照）
    avatar: /img/friends/x0fan.webp
    tags: [技术博客]

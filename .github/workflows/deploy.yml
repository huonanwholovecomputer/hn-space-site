name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone PaperMod theme
        run: git clone --depth 1 https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo --minify --cleanDestinationDir

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via rsync
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER || 'root' }}
          REMOTE_DIR: /var/www/blog
        run: |
          set -e
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          # ensure rsync exists on the server
          ssh ${SSH_OPTS} "${USER}@${HOST}" "command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync)"
          # sync public/ to the site root (incremental, resume-able, cleans stale files)
          for i in 1 2 3; do
            if rsync -az --delete --partial --timeout=180 -e "ssh ${SSH_OPTS}" public/ "${USER}@${HOST}:${REMOTE_DIR}/"; then
              break
            fi
            echo "rsync attempt ${i} failed, retrying..."
            sleep 5
          done
          # fix ownership/permissions and verify
          ssh ${SSH_OPTS} "${USER}@${HOST}" "chown -R www-data:www-data ${REMOTE_DIR} && chmod -R a+rX ${REMOTE_DIR} && curl -s --resolve blog.hn-space.cn:443:127.0.0.1 -o /dev/null -w 'HTTP %{http_code}\n' https://blog.hn-space.cn/"
